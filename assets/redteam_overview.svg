<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-labelledby="t d">
  <title id="t">SwarmEvolve-cyber workflow</title>
  <desc id="d">Six stages light up in turn: the codebase is cut into seams and shards; hunters investigate them; findings go to a shared board; critics try to refute them; a planner links capabilities into chain hypotheses; an approval gate stays locked until the owner approves, then a sandboxed check runs.</desc>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { font-size: 26px; font-weight: 700; fill: #f1f5f9; }
    .sub { font-size: 14px; fill: #94a3b8; }
    .name { font-size: 13px; font-weight: 600; fill: #e2e8f0; text-anchor: middle; }
    .hint { font-size: 11px; fill: #94a3b8; text-anchor: middle; }
    .tiny { font-size: 9px; fill: #cbd5e1; }
    .foot { font-size: 12.5px; fill: #94a3b8; text-anchor: middle; }
    .stage { fill: #111c33; stroke: #2b3a55; stroke-width: 1.5; animation: 12s linear infinite; }
    .arrow { stroke: #475569; stroke-width: 1.5; fill: none; }
    .s1 { animation-name: g1; } .s2 { animation-name: g2; } .s3 { animation-name: g3; }
    .s4 { animation-name: g4; } .s5 { animation-name: g5; } .s6 { animation-name: g6; }
    @keyframes g1 { 0%, 12% { stroke: #2dd4bf; stroke-width: 2.5; } 13%, 100% { stroke: #2b3a55; stroke-width: 1.5; } }
    @keyframes g2 { 0%, 12% { stroke: #2b3a55; stroke-width: 1.5; } 13%, 30% { stroke: #2dd4bf; stroke-width: 2.5; } 31%, 100% { stroke: #2b3a55; stroke-width: 1.5; } }
    @keyframes g3 { 0%, 24% { stroke: #2b3a55; stroke-width: 1.5; } 25%, 44% { stroke: #2dd4bf; stroke-width: 2.5; } 45%, 100% { stroke: #2b3a55; stroke-width: 1.5; } }
    @keyframes g4 { 0%, 43% { stroke: #2b3a55; stroke-width: 1.5; } 44%, 56% { stroke: #2dd4bf; stroke-width: 2.5; } 57%, 100% { stroke: #2b3a55; stroke-width: 1.5; } }
    @keyframes g5 { 0%, 54% { stroke: #2b3a55; stroke-width: 1.5; } 55%, 70% { stroke: #2dd4bf; stroke-width: 2.5; } 71%, 100% { stroke: #2b3a55; stroke-width: 1.5; } }
    @keyframes g6 { 0%, 70% { stroke: #2b3a55; stroke-width: 1.5; } 71%, 74% { stroke: #fbbf24; stroke-width: 2.5; } 76%, 97% { stroke: #2dd4bf; stroke-width: 2.5; } 100% { stroke: #2b3a55; stroke-width: 1.5; } }

    .file { fill: #1e293b; stroke: #64748b; stroke-width: 1; }
    .cut { stroke: #2dd4bf; stroke-width: 1.5; stroke-dasharray: 3 3; animation: cut 12s linear infinite; }
    @keyframes cut { 0%, 2% { opacity: 0; } 6%, 96% { opacity: 1; } 100% { opacity: 0; } }

    .dot { fill: #fb7185; animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

    .board { fill: #0b1324; stroke: #334155; stroke-width: 1; }
    .row { animation: 12s linear infinite; }
    .r1 { animation-name: r1; } .r2 { animation-name: r2; } .r3 { animation-name: r3; } .r4 { animation-name: r4; }
    @keyframes r1 { 0%, 25% { opacity: 0; } 28%, 96% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes r2 { 0%, 30% { opacity: 0; } 33%, 96% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes r3 { 0%, 35% { opacity: 0; } 38%, 96% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes r4 { 0%, 40% { opacity: 0; } 43%, 96% { opacity: 1; } 100% { opacity: 0; } }

    .mark { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; animation: 12s linear infinite; }
    .keep { stroke: #2dd4bf; animation-name: m1; } .drop { stroke: #f87171; animation-name: m2; }
    @keyframes m1 { 0%, 45% { opacity: 0; } 48%, 96% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes m2 { 0%, 50% { opacity: 0; } 53%, 96% { opacity: 1; } 100% { opacity: 0; } }

    .link { stroke: #475569; stroke-width: 2; }
    .node { fill: #2b3a55; stroke: #64748b; stroke-width: 1.5; animation: 12s linear infinite; }
    .n1 { animation-name: n1; } .n2 { animation-name: n2; } .n3 { animation-name: n3; }
    @keyframes n1 { 0%, 55% { fill: #2b3a55; } 57%, 96% { fill: #2dd4bf; } 100% { fill: #2b3a55; } }
    @keyframes n2 { 0%, 60% { fill: #2b3a55; } 62%, 96% { fill: #2dd4bf; } 100% { fill: #2b3a55; } }
    @keyframes n3 { 0%, 65% { fill: #2b3a55; } 67%, 96% { fill: #2dd4bf; } 100% { fill: #2b3a55; } }

    .lockbody { animation: lb 12s linear infinite; }
    @keyframes lb { 0%, 74% { fill: #fbbf24; } 76%, 97% { fill: #2dd4bf; } 100% { fill: #fbbf24; } }
    .shackle { fill: none; stroke-width: 4; stroke-linecap: round; animation: sh 12s linear infinite; }
    @keyframes sh { 0%, 74% { stroke: #fbbf24; transform: translateY(0); } 76%, 97% { stroke: #2dd4bf; transform: translateY(-7px); } 100% { stroke: #fbbf24; transform: translateY(0); } }
    .proof { animation: pf 12s linear infinite; }
    @keyframes pf { 0%, 82% { opacity: 0; } 85%, 97% { opacity: 1; } 100% { opacity: 0; } }
  </style>

  <rect width="900" height="380" rx="14" fill="#0b1220"/>
  <text x="30" y="52" class="title">SwarmEvolve-cyber</text>
  <text x="30" y="80" class="sub">Security audit and red-team workflow for the SwarmEvolve benchmarks and baselines</text>

  <!-- arrows between stages -->
  <g class="arrow">
    <path d="M150 206 H164 M160 202 L165 206 L160 210"/>
    <path d="M296 206 H310 M306 202 L311 206 L306 210"/>
    <path d="M442 206 H456 M452 202 L457 206 L452 210"/>
    <path d="M588 206 H602 M598 202 L603 206 L598 210"/>
    <path d="M734 206 H748 M744 202 L749 206 L744 210"/>
  </g>

  <!-- 1 codebase -->
  <rect class="stage s1" x="23" y="118" width="124" height="176" rx="10"/>
  <text x="85" y="142" class="name">Codebase</text>
  <rect class="file" x="55" y="160" width="60" height="18" rx="3"/>
  <rect class="file" x="55" y="184" width="60" height="18" rx="3"/>
  <rect class="file" x="55" y="208" width="60" height="18" rx="3"/>
  <path class="cut" d="M85 154 V232 M49 181 H121 M49 205 H121"/>
  <text x="85" y="262" class="hint">cut into</text>
  <text x="85" y="277" class="hint">seams and shards</text>

  <!-- 2 hunters -->
  <rect class="stage s2" x="169" y="118" width="124" height="176" rx="10"/>
  <text x="231" y="142" class="name">Hunters</text>
  <g>
    <circle class="dot" cx="199" cy="166" r="4.5" style="animation-delay:-0.0s"/><circle class="dot" cx="215" cy="166" r="4.5" style="animation-delay:-0.7s"/><circle class="dot" cx="231" cy="166" r="4.5" style="animation-delay:-0.3s"/><circle class="dot" cx="247" cy="166" r="4.5" style="animation-delay:-1.1s"/><circle class="dot" cx="263" cy="166" r="4.5" style="animation-delay:-0.5s"/>
    <circle class="dot" cx="199" cy="182" r="4.5" style="animation-delay:-0.9s"/><circle class="dot" cx="215" cy="182" r="4.5" style="animation-delay:-0.2s"/><circle class="dot" cx="231" cy="182" r="4.5" style="animation-delay:-1.3s"/><circle class="dot" cx="247" cy="182" r="4.5" style="animation-delay:-0.6s"/><circle class="dot" cx="263" cy="182" r="4.5" style="animation-delay:-1.0s"/>
    <circle class="dot" cx="199" cy="198" r="4.5" style="animation-delay:-0.4s"/><circle class="dot" cx="215" cy="198" r="4.5" style="animation-delay:-1.2s"/><circle class="dot" cx="231" cy="198" r="4.5" style="animation-delay:-0.1s"/><circle class="dot" cx="247" cy="198" r="4.5" style="animation-delay:-0.8s"/><circle class="dot" cx="263" cy="198" r="4.5" style="animation-delay:-1.4s"/>
    <circle class="dot" cx="199" cy="214" r="4.5" style="animation-delay:-1.5s"/><circle class="dot" cx="215" cy="214" r="4.5" style="animation-delay:-0.35s"/><circle class="dot" cx="231" cy="214" r="4.5" style="animation-delay:-0.95s"/><circle class="dot" cx="247" cy="214" r="4.5" style="animation-delay:-0.15s"/><circle class="dot" cx="263" cy="214" r="4.5" style="animation-delay:-0.75s"/>
    <circle class="dot" cx="199" cy="230" r="4.5" style="animation-delay:-0.55s"/><circle class="dot" cx="215" cy="230" r="4.5" style="animation-delay:-1.05s"/><circle class="dot" cx="231" cy="230" r="4.5" style="animation-delay:-0.65s"/><circle class="dot" cx="247" cy="230" r="4.5" style="animation-delay:-1.25s"/><circle class="dot" cx="263" cy="230" r="4.5" style="animation-delay:-0.25s"/>
  </g>
  <text x="231" y="262" class="hint">one per unit,</text>
  <text x="231" y="277" class="hint">30+ per round</text>

  <!-- 3 shared board -->
  <rect class="stage s3" x="315" y="118" width="124" height="176" rx="10"/>
  <text x="377" y="142" class="name">Shared board</text>
  <rect class="board" x="329" y="154" width="96" height="88" rx="5"/>
  <g class="row r1"><rect x="336" y="162" width="6" height="6" rx="1" fill="#2dd4bf"/><text x="347" y="169" class="tiny">fact  file:line</text></g>
  <g class="row r2"><rect x="336" y="181" width="6" height="6" rx="1" fill="#fbbf24"/><text x="347" y="188" class="tiny">lead  → owner</text></g>
  <g class="row r3"><rect x="336" y="200" width="6" height="6" rx="1" fill="#fb7185"/><text x="347" y="207" class="tiny">primitive</text></g>
  <g class="row r4"><rect x="336" y="219" width="6" height="6" rx="1" fill="#64748b"/><text x="347" y="226" class="tiny">dead end</text></g>
  <text x="377" y="262" class="hint">agents tell each</text>
  <text x="377" y="277" class="hint">other, with evidence</text>

  <!-- 4 critics -->
  <rect class="stage s4" x="461" y="118" width="124" height="176" rx="10"/>
  <text x="523" y="142" class="name">Critics</text>
  <rect class="board" x="479" y="164" width="88" height="26" rx="5"/>
  <text x="488" y="181" class="tiny">claim A</text>
  <path class="mark keep" d="M541 177 l5 5 l10 -11"/>
  <rect class="board" x="479" y="202" width="88" height="26" rx="5"/>
  <text x="488" y="219" class="tiny">claim B</text>
  <path class="mark drop" d="M543 209 l11 11 M554 209 l-11 11"/>
  <text x="523" y="262" class="hint">try to refute</text>
  <text x="523" y="277" class="hint">every claim</text>

  <!-- 5 chain planner -->
  <rect class="stage s5" x="607" y="118" width="124" height="176" rx="10"/>
  <text x="669" y="142" class="name">Chain planner</text>
  <path class="link" d="M639 196 H699"/>
  <circle class="node n1" cx="633" cy="196" r="9"/>
  <circle class="node n2" cx="669" cy="196" r="9"/>
  <circle class="node n3" cx="705" cy="196" r="9"/>
  <text x="669" y="228" class="tiny" text-anchor="middle">gains → needs → gains</text>
  <text x="669" y="262" class="hint">link capabilities</text>
  <text x="669" y="277" class="hint">into hypotheses</text>

  <!-- 6 approval gate -->
  <rect class="stage s6" x="753" y="118" width="124" height="176" rx="10"/>
  <text x="815" y="142" class="name">Approval gate</text>
  <path class="shackle" d="M792 186 v-9 a11 11 0 0 1 22 0 v9"/>
  <rect class="lockbody" x="786" y="186" width="34" height="26" rx="5"/>
  <g class="proof">
    <rect x="828" y="188" width="30" height="22" rx="4" fill="#0b1324" stroke="#2dd4bf" stroke-width="1.5"/>
    <path d="M835 199 l5 5 l10 -10" fill="none" stroke="#2dd4bf" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="815" y="238" class="tiny" text-anchor="middle">sandbox · no network</text>
  <text x="815" y="262" class="hint">owner approves,</text>
  <text x="815" y="277" class="hint">then a PoC runs</text>

  <text x="450" y="338" class="foot">Source analysis first. A proof of concept runs only after the owner approves it,</text>
  <text x="450" y="356" class="foot">in a sandbox with no network, a read-only target and dummy data.</text>
</svg>
